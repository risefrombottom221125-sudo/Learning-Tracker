  <style>
    /* Pengaturan dasar font dan pencegahan scroll horizontal */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Transisi halus pada progress bar */
    .progress-fill {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Efek sorotan saat tombol 'Lanjutkan' atau 'Set Timer' diklik */
    @keyframes timerHighlight {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65); border-color: #10B981; }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); border-color: #10B981; }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .highlight-pulse {
      animation: timerHighlight 1.4s ease-out 2;
    }

    /* Custom Scrollbar minimalis */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.55);
    }

    /* Animasi masuk Toast */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-enter {
      animation: slideUpFade 0.25s ease-out forwards;
    }
  </style>
</head>

  <!-- SCRIPT UTAMA APLIKASI -->
  <script>
    // =========================================================================
    // 1. STATE APLIKASI & DATA AWAL (DEFAULT DEMO)
    // =========================================================================
    const STORAGE_KEY = 'dashboard_belajar_saya_v2';

    function getLocalDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const DEFAULT_STATE = {
      userName: 'Pelajar',
      theme: 'dark',
      streak: 7,
      totalMinutes: 4965, // 82 Jam 45 Menit
      defaultFocusMinutes: 25,
      currentFocusMinutes: 25,
      lastActiveDate: getLocalDateKey(),
      dailyMinutesMap: {},
      weeklyMinutes: [90, 180, 270, 210, 120, 300, 150], // Sen - Min (dalam menit)
      activeSubtopicId: 'sub-3',
      modules: [
        {
          id: 'mod-1',
          title: 'Dasar-Dasar UI/UX',
          loggedMinutes: 2520,
          targetValue: 2,
          targetUnit: 'minggu',
          targetDays: 14,
          sessionsPerDay: 1,
          targetSpentMinutes: 50,
          createdAt: new Date(Date.now() - 4 * 24 * 60 * 60 * 1000).toISOString(),
          deadlineAt: new Date(Date.now() + 10 * 24 * 60 * 60 * 1000).toISOString(),
          notes: [
            {
              id: 'note-1',
              type: 'kendala',
              date: getLocalDateKey(new Date(Date.now() - 24 * 60 * 60 * 1000)),
              category: 'Tugas / Aktivitas Mendadak',
              content: 'Ada agenda mendadak kemarin sehingga sesi Wireframing tertunda. Dikejar melalui penyesuaian target harian hari ini.'
            }
          ],
          subtopics: [
            { id: 'sub-1', title: 'Pengenalan UI/UX', completed: true },
            { id: 'sub-2', title: 'Teori Warna & Tipografi', completed: true },
            { id: 'sub-3', title: 'Wireframing', completed: false }
          ]
        },
        {
          id: 'mod-2',
          title: 'Pemrograman Web Dasar',
          loggedMinutes: 2445,
          targetValue: 1,
          targetUnit: 'bulan',
          targetDays: 30,
          sessionsPerDay: 1,
          targetSpentMinutes: 25,
          createdAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(),
          deadlineAt: new Date(Date.now() + 28 * 24 * 60 * 60 * 1000).toISOString(),
          notes: [],
          subtopics: [
            { id: 'sub-4', title: 'HTML & CSS dasar', completed: true },
            { id: 'sub-5', title: 'JavaScript Intro', completed: false },
            { id: 'sub-6', title: 'DOM Manipulation', completed: false }
          ]
        }
      ],
      habits: [
        { id: 'hab-1', title: 'Membaca Modul (30 m)', completed: false },
        { id: 'hab-2', title: 'Latihan Coding', completed: false },
        { id: 'hab-3', title: 'Mengulang Kosa Kata', completed: false }
      ],
      sessionLogs: [
        { id: 'log-1', date: getLocalDateKey(), time: '09:30', subtopicTitle: 'Teori Warna & Tipografi', moduleTitle: 'Dasar-Dasar UI/UX', minutes: 45, type: 'Pomodoro' },
        { id: 'log-2', date: getLocalDateKey(new Date(Date.now() - 86400000)), time: '19:15', subtopicTitle: 'HTML & CSS dasar', moduleTitle: 'Pemrograman Web Dasar', minutes: 60, type: 'Manual' }
      ]
    };

    let state = loadState();
    let activeTab = 'dashboard';
    let isSidebarCollapsed = false;

    // State runtime timer
    let timerState = {
      mode: 'focus', // 'focus' | 'shortBreak' | 'longBreak' | 'custom'
      durationSeconds: (state.currentFocusMinutes || state.defaultFocusMinutes) * 60,
      remainingSeconds: (state.currentFocusMinutes || state.defaultFocusMinutes) * 60,
      isRunning: false,
      intervalId: null
    };

    // Referensi instance Chart.js
    let weeklyChartInstance = null;

    // =========================================================================
    // 2. PENYIMPANAN LOCALSTORAGE, REAL-TIME CLOCK, & UTILITAS
    // =========================================================================
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        const merged = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };

        if (!merged.currentFocusMinutes) {
          merged.currentFocusMinutes = merged.defaultFocusMinutes || 25;
        }
        if (!Array.isArray(merged.weeklyMinutes) || merged.weeklyMinutes.length !== 7) {
          merged.weeklyMinutes = [90, 180, 270, 210, 120, 300, 150];
        }
        if (!merged.dailyMinutesMap || typeof merged.dailyMinutesMap !== 'object') {
          merged.dailyMinutesMap = {};
        }

        // Cek pergantian hari otomatis saat aplikasi dimuat
        const todayKey = getLocalDateKey();
        if (merged.lastActiveDate !== todayKey) {
          merged.habits = (merged.habits || []).map(h => ({ ...h, completed: false }));
          merged.lastActiveDate = todayKey;
        }

        // Normalisasi properti target waktu & catatan kendala pada setiap modul
        merged.modules = (merged.modules || []).map(mod => {
          const normalizedNotes = Array.isArray(mod.notes) ? mod.notes : [];
          if (mod.targetUnit && mod.targetUnit !== 'none' && mod.targetValue) {
            const start = mod.createdAt ? new Date(mod.createdAt) : new Date();
            const computedDays = mod.targetDays || calculateTargetDays(mod.targetValue, mod.targetUnit, start);
            return {
              ...mod,
              notes: normalizedNotes,
              targetDays: computedDays,
              sessionsPerDay: mod.sessionsPerDay || 1,
              targetSpentMinutes: typeof mod.targetSpentMinutes === 'number' ? mod.targetSpentMinutes : 0
            };
          }
          return { ...mod, notes: normalizedNotes };
        });

        return merged;
      } catch (err) {
        console.error('Gagal memuat data localStorage:', err);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Gagal menyimpan data ke localStorage:', err);
      }
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMinutesToHoursText(totalMins) {
      const safeMins = Math.max(0, Math.round(totalMins || 0));
      const hours = Math.floor(safeMins / 60);
      const mins = safeMins % 60;
      if (hours === 0) return `${mins} Menit`;
      if (mins === 0) return `${hours} Jam 0 Menit`;
      return `${hours} Jam ${mins} Menit`;
    }

    function formatMinutesShort(totalMins) {
      const safeMins = Math.max(0, Math.round(totalMins || 0));
      const hours = Math.floor(safeMins / 60);
      const mins = safeMins % 60;
      if (hours === 0) return `${mins}m`;
      if (mins === 0) return `${hours}j`;
      return `${hours}j ${mins}m`;
    }

    function formatSecondsMMSS(sec) {
      const safe = Math.max(0, Math.floor(sec));
      const m = String(Math.floor(safe / 60)).padStart(2, '0');
      const s = String(safe % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function formatDateIndo(isoOrKey) {
      if (!isoOrKey) return '-';
      const d = isoOrKey.length === 10 ? new Date(isoOrKey + 'T00:00:00') : new Date(isoOrKey);
      if (isNaN(d.getTime())) return isoOrKey;
      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      }).format(d);
    }

    // Jam & Kalender 24-Jam Real-Time di Header + Deteksi Pergantian Hari Otomatis
    function updateLiveClock() {
      const now = new Date();
      const datePart = new Intl.DateTimeFormat('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(now);

      const timePart = new Intl.DateTimeFormat('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(now).replace(/\./g, ':');

      const clockEl = document.getElementById('liveDateTime');
      if (clockEl) {
        clockEl.textContent = `${datePart} • ${timePart}`;
      }

      // Cek pergantian hari (Midnight Rollover) secara real-time
      const todayKey = getLocalDateKey(now);
      if (state.lastActiveDate !== todayKey) {
        state.lastActiveDate = todayKey;
        state.habits = state.habits.map(h => ({ ...h, completed: false }));
        saveState();
        renderApp();
        showToast('Hari baru dimulai! Checklist Tracker Harian telah di-reset.', 'info');
      }
    }

    // =========================================================================
    // 3. KALKULASI DEADLINE, TARGET WAKTU MODUL, & SMART CATCH-UP
    // =========================================================================
    function calculateDeadlineFromDuration(value, unit, baseDate = new Date()) {
      if (!unit || unit === 'none' || !value) return null;
      const amount = Math.max(1, parseInt(value, 10) || 1);
      const start = new Date(baseDate);
      const target = new Date(start);

      if (unit === 'hari') {
        target.setDate(start.getDate() + amount);
      } else if (unit === 'minggu') {
        target.setDate(start.getDate() + amount * 7);
      } else if (unit === 'bulan') {
        target.setMonth(start.getMonth() + amount);
      } else {
        return null;
      }
      return target.toISOString();
    }

    function calculateTargetDays(value, unit, baseDate = new Date()) {
      if (!unit || unit === 'none' || !value) return 0;
      const amount = Math.max(1, parseInt(value, 10) || 1);
      if (unit === 'hari') return amount;
      if (unit === 'minggu') return amount * 7;
      if (unit === 'bulan') {
        const start = new Date(baseDate);
        start.setHours(0, 0, 0, 0);
        const end = new Date(start);
        end.setMonth(start.getMonth() + amount);
        return Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)));
      }
      return 0;
    }

    function getModuleTargetTimeInfo(mod) {
      if (!mod.targetUnit || mod.targetUnit === 'none' || !mod.targetValue) {
        return null;
      }

      const start = mod.createdAt ? new Date(mod.createdAt) : new Date();
      const totalDays = mod.targetDays || calculateTargetDays(mod.targetValue, mod.targetUnit, start);
      const sessionsPerDay = Math.max(1, parseInt(mod.sessionsPerDay, 10) || 1);
      const focusDuration = state.currentFocusMinutes || state.defaultFocusMinutes || 25;

      // Total target menit = Jumlah Hari x Durasi Fokus Aktif x Sesi/hari
      const totalTargetMinutes = totalDays * focusDuration * sessionsPerDay;
      const spentMinutes = Math.max(0, mod.targetSpentMinutes || 0);
      const remainingTargetMinutes = Math.max(0, totalTargetMinutes - spentMinutes);
      const timePercent = totalTargetMinutes > 0
        ? Math.min(100, Math.round((spentMinutes / totalTargetMinutes) * 100))
        : 0;

      // Hitung sisa hari hingga deadline
      const now = new Date();
      const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const deadlineDate = mod.deadlineAt ? new Date(mod.deadlineAt) : new Date(calculateDeadlineFromDuration(mod.targetValue, mod.targetUnit, start));
      const deadlineMid = new Date(deadlineDate.getFullYear(), deadlineDate.getMonth(), deadlineDate.getDate());

      const diffDays = Math.round((deadlineMid - todayMid) / (1000 * 60 * 60 * 24));
      const isOverdue = diffDays < 0;
      const isDueToday = diffDays === 0;
      const remainingEffectiveDays = Math.max(1, diffDays);

      // Kalkulasi Smart Catch-Up (Penyesuaian Target Harian saat hari terlewat)
      const baselineDailyMinutes = focusDuration * sessionsPerDay;
      const catchUpDailyMinutes = remainingTargetMinutes > 0
        ? Math.ceil(remainingTargetMinutes / remainingEffectiveDays)
        : 0;
      const extraDailyMinutes = Math.max(0, catchUpDailyMinutes - baselineDailyMinutes);
      const needsCatchUp = remainingTargetMinutes > 0 && extraDailyMinutes >= 2;

      const unitLabel = mod.targetUnit.charAt(0).toUpperCase() + mod.targetUnit.slice(1);
      const durationBadge = `${mod.targetValue} ${unitLabel}`;

      let statusText = '';
      if (remainingTargetMinutes === 0) {
        statusText = 'Target Waktu Tuntas ✓';
      } else if (isOverdue) {
        statusText = `Terlewat ${Math.abs(diffDays)} hari`;
      } else if (isDueToday) {
        statusText = 'Tenggat Hari Ini';
      } else {
        statusText = `Sisa ${diffDays} hari`;
      }

      return {
        durationBadge,
        totalDays,
        sessionsPerDay,
        focusDuration,
        totalTargetMinutes,
        spentMinutes,
        remainingTargetMinutes,
        timePercent,
        diffDays,
        isOverdue,
        isDueToday,
        statusText,
        deadlineFormatted: formatDateIndo(deadlineDate.toISOString()),
        baselineDailyMinutes,
        catchUpDailyMinutes,
        extraDailyMinutes,
        needsCatchUp
      };
    }

    function getModuleProgress(mod) {
      const total = mod.subtopics.length;
      if (total === 0) return 0;
      const done = mod.subtopics.filter(s => s.completed).length;
      return Math.round((done / total) * 100);
    }

    function getOverallProgress() {
      let total = 0;
      let done = 0;
      state.modules.forEach(m => {
        total += m.subtopics.length;
        done += m.subtopics.filter(s => s.completed).length;
      });
      return total === 0 ? 0 : Math.round((done / total) * 100);
    }

    function findSubtopicInfo(subtopicId) {
      for (const mod of state.modules) {
        const sub = mod.subtopics.find(s => s.id === subtopicId);
        if (sub) return { module: mod, subtopic: sub };
      }
      return null;
    }

    // =========================================================================
    // 4. NOTIFIKASI TOAST & AUDIO CHIME (WEB AUDIO API)
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        info: 'bg-[#6366F1] text-white border-indigo-400',
        warning: 'bg-amber-600 text-white border-amber-500'
      };

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium shadow-lg ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'warning' ? 'alert-circle' : 'sparkles'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1">${escapeHTML(message)}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3400);
    }

    function playCompletionChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99]; // C5 - E5 - G5
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
          gain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.14 + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.6);
        });
      } catch (e) {
        // Abaikan jika browser memblokir autoplay audio
      }
    }

    // =========================================================================
    // 6. LOGIKA KURIKULUM, SUB-BAB, HABITS, & PENCATATAN WAKTU
    // =========================================================================
    function toggleSubtopic(moduleId, subtopicId) {
      const mod = state.modules.find(m => m.id === moduleId);
      if (!mod) return;
      const sub = mod.subtopics.find(s => s.id === subtopicId);
      if (!sub) return;

      sub.completed = !sub.completed;
      saveState();
      renderApp();

      if (sub.completed) {
        showToast(`Sub-bab "${sub.title}" selesai!`, 'success');
      }
    }

    function deleteSubtopic(moduleId, subtopicId) {
      const mod = state.modules.find(m => m.id === moduleId);
      if (!mod) return;
      mod.subtopics = mod.subtopics.filter(s => s.id !== subtopicId);
      if (state.activeSubtopicId === subtopicId) {
        state.activeSubtopicId = getFirstIncompleteSubtopicId() || '';
      }
      saveState();
      renderApp();
      showToast('Sub-bab berhasil dihapus.', 'info');
    }

    function deleteModule(moduleId) {
      state.modules = state.modules.filter(m => m.id !== moduleId);
      if (!findSubtopicInfo(state.activeSubtopicId)) {
        state.activeSubtopicId = getFirstIncompleteSubtopicId() || '';
      }
      saveState();
      renderApp();
      showToast('Modul berhasil dihapus.', 'info');
    }

    function resetAllSubtopics() {
      state.modules.forEach(m => {
        m.subtopics.forEach(s => { s.completed = false; });
      });
      saveState();
      renderApp();
      showToast('Semua centang sub-bab telah di-reset.', 'info');
    }

    function getFirstIncompleteSubtopicId() {
      for (const mod of state.modules) {
        const found = mod.subtopics.find(s => !s.completed);
        if (found) return found.id;
      }
      if (state.modules.length > 0 && state.modules[0].subtopics.length > 0) {
        return state.modules[0].subtopics[0].id;
      }
      return '';
    }

    function handleQuickResume() {
      const nextId = getFirstIncompleteSubtopicId();
      if (!nextId) {
        showToast('Semua materi sudah selesai! Tambahkan modul baru.', 'success');
        return;
      }
      state.activeSubtopicId = nextId;
      saveState();
      renderApp();

      const info = findSubtopicInfo(nextId);
      const timerCard = document.getElementById('focusTimerCard');
      if (timerCard) {
        timerCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        timerCard.classList.remove('highlight-pulse');
        void timerCard.offsetWidth;
        timerCard.classList.add('highlight-pulse');
      }
      if (info) {
        showToast(`Siap fokus pada: ${info.subtopic.title}`, 'info');
      }
    }

    function focusOnModule(moduleId) {
      const mod = state.modules.find(m => m.id === moduleId);
      if (!mod) return;
      const targetSub = mod.subtopics.find(s => !s.completed) || mod.subtopics[0];
      if (targetSub) {
        state.activeSubtopicId = targetSub.id;
        saveState();
        renderApp();
      }
      const timerCard = document.getElementById('focusTimerCard');
      if (timerCard) {
        timerCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        timerCard.classList.remove('highlight-pulse');
        void timerCard.offsetWidth;
        timerCard.classList.add('highlight-pulse');
      }
      showToast(`Fokus Timer ditautkan ke modul "${mod.title}"`, 'info');
    }

    function applyCatchUpTimer(moduleId, minutes) {
      const mod = state.modules.find(m => m.id === moduleId);
      if (!mod) return;
      const targetSub = mod.subtopics.find(s => !s.completed) || mod.subtopics[0];
      if (targetSub) {
        state.activeSubtopicId = targetSub.id;
      }
      const safeMins = Math.max(1, Math.min(240, parseInt(minutes, 10) || 25));
      pauseTimer();
      timerState.mode = 'custom';
      timerState.durationSeconds = safeMins * 60;
      timerState.remainingSeconds = safeMins * 60;
      saveState();
      renderApp();

      const timerCard = document.getElementById('focusTimerCard');
      if (timerCard) {
        timerCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        timerCard.classList.remove('highlight-pulse');
        void timerCard.offsetWidth;
        timerCard.classList.add('highlight-pulse');
      }
      showToast(`Timer diatur ke ${safeMins} menit untuk mengejar target "${mod.title}"!`, 'success');
    }

    function toggleHabit(habitId) {
      const habit = state.habits.find(h => h.id === habitId);
      if (!habit) return;
      habit.completed = !habit.completed;
      saveState();
      renderApp();
      if (habit.completed) {
        showToast(`Target harian "${habit.title}" tercapai!`, 'success');
      }
    }

    function deleteHabit(habitId) {
      state.habits = state.habits.filter(h => h.id !== habitId);
      saveState();
      renderApp();
    }

    function logStudyMinutes(minutes, subtopicId, sourceType = 'Pomodoro') {
      const addedMins = Math.max(1, Math.round(minutes));
      state.totalMinutes = (state.totalMinutes || 0) + addedMins;

      // Update grafik mingguan (Senin = 0 ... Minggu = 6)
      const now = new Date();
      const jsDay = now.getDay(); // 0 = Min, 1 = Sen ... 6 = Sab
      const idx = jsDay === 0 ? 6 : jsDay - 1;
      state.weeklyMinutes[idx] = (state.weeklyMinutes[idx] || 0) + addedMins;

      const todayKey = getLocalDateKey(now);
      state.dailyMinutesMap[todayKey] = (state.dailyMinutesMap[todayKey] || 0) + addedMins;

      // Update durasi spesifik pada modul tertaut
      const info = findSubtopicInfo(subtopicId || state.activeSubtopicId);
      let subTitle = 'Sesi Belajar Umum';
      let modTitle = 'Umum';

      if (info) {
        info.module.loggedMinutes = (info.module.loggedMinutes || 0) + addedMins;
        if (info.module.targetUnit && info.module.targetUnit !== 'none') {
          info.module.targetSpentMinutes = (info.module.targetSpentMinutes || 0) + addedMins;
        }
        subTitle = info.subtopic.title;
        modTitle = info.module.title;
      }

      const timeStr = new Intl.DateTimeFormat('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now).replace(/\./g, ':');

      state.sessionLogs.unshift({
        id: 'log-' + Date.now(),
        date: todayKey,
        time: timeStr,
        subtopicTitle: subTitle,
        moduleTitle: modTitle,
        minutes: addedMins,
        type: sourceType
      });

      if (state.sessionLogs.length > 50) {
        state.sessionLogs = state.sessionLogs.slice(0, 50);
      }

      saveState();
      renderApp();
    }

    // =========================================================================
    // 7. LOGIKA FOKUS TIMER (POMODORO & KUSTOM)
    // =========================================================================
    function setTimerPreset(mode, minutes) {
      pauseTimer();
      timerState.mode = mode;
      if (mode === 'focus') {
        state.currentFocusMinutes = minutes;
        saveState();
      }
      timerState.durationSeconds = minutes * 60;
      timerState.remainingSeconds = minutes * 60;
      renderApp();
    }

    function startTimer() {
      if (timerState.isRunning) return;
      timerState.isRunning = true;
      updateTimerDisplayUI();

      timerState.intervalId = setInterval(() => {
        if (timerState.remainingSeconds > 0) {
          timerState.remainingSeconds -= 1;
          updateTimerDisplayUI();
        } else {
          completeTimerSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      timerState.isRunning = false;
      if (timerState.intervalId) {
        clearInterval(timerState.intervalId);
        timerState.intervalId = null;
      }
      updateTimerDisplayUI();
    }

    function resetTimer() {
      pauseTimer();
      timerState.remainingSeconds = timerState.durationSeconds;
      updateTimerDisplayUI();
    }

    function simulateTimerComplete() {
      completeTimerSession();
    }

    function completeTimerSession() {
      pauseTimer();
      playCompletionChime();

      const sessionMins = Math.max(1, Math.round(timerState.durationSeconds / 60));
      const isStudyMode = timerState.mode === 'focus' || timerState.mode === 'custom';

      if (isStudyMode) {
        logStudyMinutes(sessionMins, state.activeSubtopicId, 'Pomodoro');
        showToast(`Sesi fokus ${sessionMins} menit selesai & tercatat!`, 'success');
      } else {
        showToast(`Waktu istirahat ${sessionMins} menit selesai! Siap fokus kembali.`, 'info');
      }

      timerState.remainingSeconds = timerState.durationSeconds;
      updateTimerDisplayUI();
    }

    function changeActiveSubtopic(newSubId) {
      state.activeSubtopicId = newSubId;
      saveState();
      updateTimerDisplayUI();
    }

    function updateTimerDisplayUI() {
      const timeStr = formatSecondsMMSS(timerState.remainingSeconds);
      const displayEl = document.getElementById('timerDisplayText');
      if (displayEl) displayEl.textContent = timeStr;

      const progressEl = document.getElementById('timerProgressBar');
      if (progressEl && timerState.durationSeconds > 0) {
        const pct = ((timerState.durationSeconds - timerState.remainingSeconds) / timerState.durationSeconds) * 100;
        progressEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      }

      const miniTimer = document.getElementById('sidebarMiniTimer');
      const miniText = document.getElementById('sidebarTimerText');
      const miniTopic = document.getElementById('sidebarTimerTopic');
      if (miniTimer && miniText && miniTopic) {
        if (timerState.isRunning) {
          miniTimer.classList.remove('hidden');
          miniText.textContent = timeStr;
          const info = findSubtopicInfo(state.activeSubtopicId);
          miniTopic.textContent = info ? info.subtopic.title : 'Sesi Fokus';
        } else {
          miniTimer.classList.add('hidden');
        }
      }

      const startBtn = document.getElementById('timerStartBtn');
      const pauseBtn = document.getElementById('timerPauseBtn');
      if (startBtn && pauseBtn) {
        if (timerState.isRunning) {
          startBtn.classList.add('opacity-50', 'pointer-events-none');
          pauseBtn.classList.remove('opacity-50');
        } else {
          startBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }
    }

    function selectDeadlineUnit(unit) {
      const unitInput = document.getElementById('deadlineUnitInput');
      const controls = document.getElementById('deadlineNumericControls');
      if (!unitInput) return;

      unitInput.value = unit;
      document.querySelectorAll('[data-unit-btn]').forEach(btn => {
        const isSelected = btn.getAttribute('data-unit-btn') === unit;
        btn.className = `px-3 py-2 rounded-xl text-xs font-semibold border transition-colors cursor-pointer ${
          isSelected
            ? 'bg-[#6366F1] text-white border-[#6366F1]'
            : 'bg-slate-50 dark:bg-[#0F172A] text-slate-600 dark:text-slate-300 border-[#E2E8F0] dark:border-[#334155] hover:border-[#6366F1]'
        }`;
      });

      if (controls) {
        if (unit === 'none') {
          controls.classList.add('hidden');
        } else {
          controls.classList.remove('hidden');
          controls.classList.add('space-y-3', 'pt-1');
          renderDeadlineQuickChips(unit);
          updateDeadlinePreview();
        }
      }
    }

    function renderDeadlineQuickChips(unit) {
      const container = document.getElementById('deadlineQuickChips');
      if (!container) return;
      const presets = unit === 'hari' ? [1, 3, 5, 10] : unit === 'minggu' ? [1, 2, 3, 4] : [1, 2, 3, 6];
      container.innerHTML = presets.map(num => `
        <button type="button" onclick="applyDeadlineQuickValue(${num})"
          class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-slate-100 dark:bg-[#0F172A] text-slate-600 dark:text-slate-300 hover:bg-indigo-500/15 hover:text-[#6366F1] transition-colors cursor-pointer">

    function applyDeadlineQuickValue(val) {
      const input = document.getElementById('deadlineValueInput');
      if (input) {
        input.value = val;
        updateDeadlinePreview();
      }
    }

    function stepDeadlineValue(delta) {
      const input = document.getElementById('deadlineValueInput');
      if (!input) return;
      const next = Math.max(1, Math.min(365, (parseInt(input.value, 10) || 1) + delta));
      input.value = next;
      updateDeadlinePreview();
    }

    function updateDeadlinePreview() {
      const unit = document.getElementById('deadlineUnitInput')?.value || 'none';
      const val = Math.max(1, parseInt(document.getElementById('deadlineValueInput')?.value, 10) || 1);
      const sessions = Math.max(1, parseInt(document.getElementById('deadlineSessionsInput')?.value, 10) || 1);
      const box = document.getElementById('deadlinePreviewBox');
      if (!box || unit === 'none') return;

      const now = new Date();
      const deadlineIso = calculateDeadlineFromDuration(val, unit, now);
      const totalDays = calculateTargetDays(val, unit, now);
      const focusMins = state.currentFocusMinutes || state.defaultFocusMinutes || 25;
      const totalTargetMins = totalDays * focusMins * sessions;

      box.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
          <span>Tenggat: <strong class="text-slate-900 dark:text-white">${formatDateIndo(deadlineIso)}</strong> (${totalDays} hari)</span>
          <span class="font-mono font-semibold text-[#6366F1]">Target: ${formatMinutesToHoursText(totalTargetMins)}</span>
        </div>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
          Dihitung dari ${totalDays} hari × ${focusMins} menit fokus × ${sessions}x sesi/hari.
        </p>
      `;
    }

    function submitAddModule(e) {
      e.preventDefault();
      const title = document.getElementById('newModuleTitle').value.trim();
      const rawSubs = document.getElementById('newModuleSubtopics').value;
      const unit = document.getElementById('deadlineUnitInput').value;
      const val = Math.max(1, parseInt(document.getElementById('deadlineValueInput')?.value, 10) || 1);
      const sessions = Math.max(1, parseInt(document.getElementById('deadlineSessionsInput')?.value, 10) || 1);

      if (!title) return;

      const subtopics = rawSubs
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map((sTitle, idx) => ({
          id: 'sub-' + Date.now() + '-' + idx,
          title: sTitle,
          completed: false
        }));

      if (subtopics.length === 0) {
        subtopics.push({ id: 'sub-' + Date.now(), title: 'Materi Utama', completed: false });
      }

      const now = new Date();
      const hasDeadline = unit && unit !== 'none';
      const newMod = {
        id: 'mod-' + Date.now(),
        title,
        loggedMinutes: 0,
        targetValue: hasDeadline ? val : 0,
        targetUnit: hasDeadline ? unit : 'none',
        targetDays: hasDeadline ? calculateTargetDays(val, unit, now) : 0,
        sessionsPerDay: sessions,
        targetSpentMinutes: 0,
        createdAt: now.toISOString(),
        deadlineAt: hasDeadline ? calculateDeadlineFromDuration(val, unit, now) : null,
        notes: [],
        subtopics
      };

      state.modules.push(newMod);
      if (!state.activeSubtopicId && subtopics.length > 0) {
        state.activeSubtopicId = subtopics[0].id;
      }

      saveState();
      closeModal();
      renderApp();
      showToast(`Modul "${title}" berhasil ditambahkan!`, 'success');
    }

    function submitModuleNote(e, moduleId) {
      e.preventDefault();
      const mod = state.modules.find(m => m.id === moduleId);
      if (!mod) return;

      const type = document.getElementById('noteTypeInput').value;
      const date = document.getElementById('noteDateInput').value || getLocalDateKey();
      const category = document.getElementById('noteCategoryInput').value;

      if (!Array.isArray(mod.notes)) mod.notes = [];
      mod.notes.unshift({
        id: 'note-' + Date.now(),
        type,
        date,
        category,
        content
      });

      saveState();
      renderApp();
      openModuleNotesModal(moduleId);
      showToast('Catatan & kendala berhasil disimpan!', 'success');
    }

      const mod = state.modules.find(m => m.id === moduleId);

      mod.notes = mod.notes.filter(n => n.id !== noteId);

    function renderWeeklyChart() {
      const canvas = document.getElementById('weeklyDurationChart');
      if (!canvas || typeof Chart === 'undefined') return;

      if (weeklyChartInstance) {
        weeklyChartInstance.destroy();
      }

      const isDark = state.theme === 'dark';
      const gridColor = isDark ? 'rgba(148, 163, 184, 0.12)' : 'rgba(100, 116, 139, 0.14)';
      const tickColor = isDark ? '#94A3B8' : '#64748B';

      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 240);
      gradient.addColorStop(0, 'rgba(99, 102, 241, 0.35)');
      gradient.addColorStop(1, 'rgba(16, 185, 129, 0.02)');

      weeklyChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
          datasets: [{
            label: 'Durasi Belajar (Menit)',
            data: state.weeklyMinutes,
            borderColor: '#6366F1',
            backgroundColor: gradient,
            borderWidth: 3,
            tension: 0.42,
            fill: true,
            pointBackgroundColor: '#10B981',
            pointBorderColor: isDark ? '#1E293B' : '#FFFFFF',
            pointBorderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: isDark ? '#0F172A' : '#1E293B',
              titleColor: '#F8FAFC',
              bodyColor: '#E2E8F0',
              padding: 10,
              cornerRadius: 10,
              callbacks: {
                label: (context) => ` ${context.parsed.y} menit (${formatMinutesToHoursText(context.parsed.y)})`
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: tickColor, font: { family: 'Plus Jakarta Sans', size: 12 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: gridColor },
              ticks: {
                color: tickColor,
                font: { family: 'JetBrains Mono', size: 11 },
                callback: (val) => `${val}m`
              }
            }
          }
        }
      });
    }

            </div>
          </section>

          <!-- KOLOM KANAN: TIMER, TRACKER HARIAN, & DIAGRAM GARIS (7 Kolom) -->
          <div class="lg:col-span-7 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${renderFocusTimerCardHTML(false)}
              ${renderHabitTrackerCardHTML()}
            </div>
            ${renderWeeklyChartCardHTML()}
          </div>

        </div>
      `;
    }

    // View 2: Tab Kurikulum Saya (Full Grid)
    function renderKurikulumView() {
      const modulesHTML = state.modules.map(m => renderModuleCardHTML(m)).join('');
      return `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
            <div>
              <h2 class="text-lg font-bold text-slate-900 dark:text-white">Semua Modul Pembelajaran (${state.modules.length})</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Kelola silabus, target deadline, kejar target harian, dan catatan kendala tiap modul.</p>
            </div>
            <button type="button" onclick="openAddModuleModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#6366F1] hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold cursor-pointer self-start sm:self-auto">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Tambah Modul Baru</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${modulesHTML}
          </div>
        </div>
      `;
    }

    // View 3: Tab Fokus Timer (Mode Fokus Penuh)
    function renderTimerView() {
      return `
        <div class="py-4">
          ${renderFocusTimerCardHTML(true)}
        </div>
      `;
    }

    // View 4: Tab Statistik & Riwayat Sesi
    function renderStatistikView() {
      const totalWeeklyMins = state.weeklyMinutes.reduce((a, b) => a + b, 0);
      const avgDailyMins = Math.round(totalWeeklyMins / 7);

      const moduleBreakdownHTML = state.modules.map(m => {
        const mins = m.loggedMinutes || 0;
        const sharePct = state.totalMinutes > 0 ? Math.min(100, Math.round((mins / state.totalMinutes) * 100)) : 0;
        return `
          <div class="space-y-1.5">
            <div class="flex justify-between text-xs sm:text-sm">
              <span class="font-medium text-slate-800 dark:text-slate-200">${escapeHTML(m.title)}</span>
              <span class="font-mono font-semibold text-[#6366F1]">${formatMinutesToHoursText(mins)} (${sharePct}%)</span>
            </div>
            <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
              <div class="progress-fill h-full rounded-full bg-[#6366F1]" style="width: ${sharePct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const logsHTML = state.sessionLogs.map(log => `
        <div class="flex items-center justify-between gap-3 py-3 border-b border-[#E2E8F0] dark:border-[#334155] last:border-0">
          <div class="min-w-0">
            <p class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white truncate">${escapeHTML(log.subtopicTitle)}</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">
              ${escapeHTML(log.moduleTitle)} • ${formatDateIndo(log.date)} ${log.time ? `(${log.time})` : ''}
            </p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-2 py-0.5 rounded-md text-[11px] font-medium ${
              log.type === 'Pomodoro' ? 'bg-indigo-500/15 text-[#6366F1]' : 'bg-emerald-500/15 text-[#10B981]'
            }">${escapeHTML(log.type)}</span>
            <span class="font-mono text-xs sm:text-sm font-bold text-slate-900 dark:text-white">+${log.minutes}m</span>
          </div>
        </div>
      `).join('');

      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
              <p class="text-xs text-slate-500 dark:text-slate-400">Total Akumulasi Belajar</p>
              <p class="font-mono text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">${formatMinutesToHoursText(state.totalMinutes)}</p>
            </div>
            <div class="bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
              <p class="text-xs text-slate-500 dark:text-slate-400">Total Minggu Ini</p>
              <p class="font-mono text-xl sm:text-2xl font-bold text-[#6366F1] mt-1">${formatMinutesToHoursText(totalWeeklyMins)}</p>
            </div>
            <div class="bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
              <p class="text-xs text-slate-500 dark:text-slate-400">Rata-rata Harian Minggu Ini</p>
              <p class="font-mono text-xl sm:text-2xl font-bold text-[#10B981] mt-1">${avgDailyMins} Menit/Hari</p>
            </div>
          </div>

          ${renderWeeklyChartCardHTML()}

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
              <h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">Distribusi Waktu per Modul</h3>
              <div class="space-y-4">${moduleBreakdownHTML}</div>
            </div>

            <div class="bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-5">
              <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2">Riwayat Sesi Belajar Terbaru</h3>
              <div class="max-h-72 overflow-y-auto">${logsHTML || '<p class="text-xs text-slate-400 py-4">Belum ada riwayat sesi.</p>'}</div>
            </div>
          </div>
        </div>
      `;
    }

    // View 5: Tab Pengaturan
    function renderPengaturanView() {
      return `
        <div class="max-w-2xl bg-white dark:bg-[#1E293B] border border-[#E2E8F0] dark:border-[#334155] rounded-2xl p-6 space-y-6">
          <div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Preferensi Pengguna & Timer</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Sesuaikan profil belajar dan durasi standar Pomodoro Anda.</p>
          </div>

          <form onsubmit="saveSettings(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Nama Tampilan</label>
              <input type="text" id="settingsUserName" value="${escapeHTML(state.userName)}" required
                class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-[#0F172A] border border-[#E2E8F0] dark:border-[#334155] focus:outline-none focus:border-[#6366F1]" />
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Durasi Fokus Default (Menit)</label>
              <input type="number" id="settingsDefaultFocus" min="5" max="180" value="${state.defaultFocusMinutes}" required
                class="w-full px-3.5 py-2.5 font-mono text-sm rounded-xl bg-slate-50 dark:bg-[#0F172A] border border-[#E2E8F0] dark:border-[#334155] focus:outline-none focus:border-[#6366F1]" />
            </div>

            <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#6366F1] hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold cursor-pointer">
              Simpan Pengaturan
            </button>
          </form>

          <div class="pt-5 border-t border-[#E2E8F0] dark:border-[#334155] flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white">Reset Data Aplikasi</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Kembalikan data ke contoh awal atau mulai dari 0 jam belajar.</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="resetToZeroData()" class="px-3.5 py-2 rounded-xl border border-amber-500/40 text-amber-600 dark:text-amber-400 hover:bg-amber-500/10 text-xs font-semibold cursor-pointer">
                Mulai dari 0 Jam
              </button>
              <button type="button" onclick="resetDemoData()" class="px-3.5 py-2 rounded-xl border border-rose-500/40 text-rose-500 hover:bg-rose-500/10 text-xs font-semibold cursor-pointer">
                Reset Demo
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function saveSettings(e) {
      e.preventDefault();
      const newName = document.getElementById('settingsUserName').value.trim() || 'Pelajar';
      const newFocus = Math.max(5, Math.min(180, parseInt(document.getElementById('settingsDefaultFocus').value, 10) || 25));

      state.userName = newName;
      state.defaultFocusMinutes = newFocus;
      state.currentFocusMinutes = newFocus;
      pauseTimer();
      timerState.mode = 'focus';
      timerState.durationSeconds = newFocus * 60;
      timerState.remainingSeconds = newFocus * 60;

      saveState();
      renderApp();
      showToast('Pengaturan berhasil disimpan!', 'success');
    }

    function resetToZeroData() {
      pauseTimer();
      state.totalMinutes = 0;
      state.streak = 0;
      state.weeklyMinutes = [0, 0, 0, 0, 0, 0, 0];
      state.dailyMinutesMap = {};
      state.sessionLogs = [];
      state.modules.forEach(m => {
        m.loggedMinutes = 0;
        m.targetSpentMinutes = 0;
      });
      saveState();
      renderApp();
      showToast('Akumulasi jam belajar diatur ulang ke 0 Menit.', 'info');
    }

    function resetDemoData() {
      pauseTimer();
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      timerState.mode = 'focus';
      timerState.durationSeconds = state.defaultFocusMinutes * 60;
      timerState.remainingSeconds = state.defaultFocusMinutes * 60;
      renderApp();
      showToast('Data demo awal dipulihkan.', 'info');
    }

    // =========================================================================
    // 10. RENDER UTAMA & INISIALISASI
    // =========================================================================
    function renderApp() {
      // Update Header
      const nameEl = document.getElementById('headerUserName');
      const streakEl = document.getElementById('headerStreak');
      const totalEl = document.getElementById('headerTotalHours');
      if (nameEl) nameEl.textContent = state.userName;
      if (streakEl) streakEl.textContent = state.streak;
      if (totalEl) totalEl.textContent = formatMinutesToHoursText(state.totalMinutes);

      // Update Highlight Navigasi Aktif
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.getAttribute('data-nav') === activeTab;
        if (isActive) {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold bg-[#6366F1]/15 text-[#6366F1] transition-colors cursor-pointer';
        } else {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 hover:text-slate-900 dark:hover:text-white transition-colors cursor-pointer';
        }
      });

      // Render Halaman Aktif
      const mainEl = document.getElementById('mainContent');
      if (!mainEl) return;

      if (activeTab === 'dashboard') {
        mainEl.innerHTML = renderDashboardView();
      } else if (activeTab === 'kurikulum') {
        mainEl.innerHTML = renderKurikulumView();
      } else if (activeTab === 'timer') {
        mainEl.innerHTML = renderTimerView();
      } else if (activeTab === 'statistik') {
        mainEl.innerHTML = renderStatistikView();
      } else if (activeTab === 'pengaturan') {
        mainEl.innerHTML = renderPengaturanView();
      }

      lucide.createIcons();
      updateTimerDisplayUI();

      if (activeTab === 'dashboard' || activeTab === 'statistik') {
        renderWeeklyChart();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      renderApp();
    });
  </script>
</body>
</html>
